name: Build Installer(nixos)
on: workflow_dispatch
jobs:
  build:
    name: Build Image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Setup Cachix cache
        uses: cachix/cachix-action@v17
        with:
          skipPush: true
          name: nixpkgs-for-nabu
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Setup environment
        run: |
          chmod o+rx /home/runner
          mkdir ./installer/images ./installer/efi/nixos
      - name: Build the image
        run: |
          nix build -L .#rootfs
          cp ./result/rootfs.img ./installer/images
      - name: Build the UKI
        run: |
          nix build .#nixosConfigurations.default.config.system.build.uki
          cp ./result/nixos.efi ./installer/efi/nixos
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: nixos-nabu-installer
          path: installer
