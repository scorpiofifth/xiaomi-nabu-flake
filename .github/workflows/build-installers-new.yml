name: Build Installer(new)
on: workflow_dispatch
jobs:
  build:
    name: Build Image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Setup Cachix cache
        uses: cachix/cachix-action@v17
        with:
          name: nixpkgs-for-nabu
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true
      - name: Fix permissions
        run: chmod o+rx /home/runner
      - name: Build the image
        run: |
          nix build .#new
      - name: Generate UKI and move image
        run: |
          nix build .#nixosConfigurations.default.config.system.build.uki
          mkdir ./installer/efi/nixos ./installer/images
          cp ./result/nixos.efi ./installer/efi/nixos
          sudo chown -R $USER:$USER ./installer/efi
          # mv outputs/out/rootfs.img ./installer/images
          cp result/nixos.img ./installer/images/rootfs.img
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: nixos-nabu-installer
          path: installer
