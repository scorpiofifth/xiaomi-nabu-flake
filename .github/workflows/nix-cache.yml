name: Nix Cache
on: workflow_dispatch
jobs:
  nix-cache:
    name: Nix Cache
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      # NOTE: you can get the cache by using
      # nix-store --realise /nix/store/xxxxxxxxxxxxx
      - name: Setup Cachix cache
        uses: cachix/cachix-action@v17
        with:
          name: nixpkgs-for-nabu
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build
        run: |
          nix-build test.nix --system aarch64-linux
