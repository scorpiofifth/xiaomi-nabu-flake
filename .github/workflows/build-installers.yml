name: Build installers
on: workflow_dispatch
jobs:
  build-installer:
    name: Build installer
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: write
      contents: read
    steps:
      - name: Update apt cache
        run: sudo apt-get update

      - name: Install tools
        run: |
          sudo apt-get install -y \
            git arch-install-scripts wget libarchive-tools e2fsprogs pigz dosfstools

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: repo

      - name: Create and mount image
        run: |
          echo "::group::Create image"
          truncate -s 20G ./rootfs.img
          mkfs.ext4 ./rootfs.img
          echo "::endgroup::"
          echo "::group::Mount image"
          mkdir mountpoint
          sudo mount -o loop ./rootfs.img ./mountpoint/
          sudo mkdir ./mountpoint/boot/efi/ -p
          sudo mount -o size=512M,mode=0755 -t tmpfs none ./mountpoint/boot/efi/
          echo "::endgroup::"

      # NOTE: remove the cache by using `gh cache delete` command
      - name: Cache rootfs tarball
        id: cache-rootfs
        uses: actions/cache@v6
        with:
          path: ArchLinuxARM-aarch64-latest.tar.gz
          key: arch-rootfs

      - name: Download generic rootfs tarball
        if: steps.cache-rootfs.outputs.cache-hit != 'true'
        run: |
          wget -qO "ArchLinuxARM-aarch64-latest.tar.gz" \
            "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"

      - name: Build rootfs-extractor image
        run: |
          echo '
          FROM alpine:latest
          RUN apk add --no-cache libarchive-tools
          ENTRYPOINT ["/bin/sh"]
          ' > Dockerfile
          docker build -t rootfs-extractor .

      - name: Extract rootfs
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/ArchLinuxARM-aarch64-latest.tar.gz:/rootfs.tar \
            -v ${{ github.workspace }}/mountpoint:/mountpoint \
            rootfs-extractor -c "
              cd /mountpoint && bsdtar -xpf /rootfs.tar
            "

      - name: Init pacman key store
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          pacman-key --init
          pacman-key --populate archlinuxarm
          EOF

      - name: Set locale
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          sed -i "s|#en_US.UTF-8 UTF-8|en_US.UTF-8 UTF-8|g" "/etc/locale.gen"
          locale-gen
          echo "LANG=en_US.UTF-8" > "/etc/locale.conf"
          EOF

      - name: Configure pacman options
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          sed -i "s/#ParallelDownloads/ParallelDownloads/g" /etc/pacman.conf
          sed -i "s/#DisableSandboxFilesystem/DisableSandboxFilesystem/g" /etc/pacman.conf
          sed -i "s/#DisableSandboxSyscalls/DisableSandboxSyscalls/g" /etc/pacman.conf
          EOF

      - name: Add nabu repo
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          printf '\n[nabu]\nSigLevel = Never\nServer = https://github.com/Kumar-Jy/Nabu-arch-images/releases/download/repo\n' >> /etc/pacman.conf
          pacman -Sy --noconfirm
          EOF

      - name: Remove generic kernel
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          pacman -R --noconfirm linux-aarch64
          EOF

      - name: Update system
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          pacman -Syu --noconfirm
          EOF

      - name: Install firmwares
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          pacman -S --noconfirm linux-firmware-xiaomi-nabu
          EOF

      - name: Install ukify
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          pacman -S --noconfirm ukify
          EOF

      - name: Install kernel and headers
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          pacman -S --noconfirm linux-nabu linux-nabu-headers
          EOF

      - name: Install alsa ucm config
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          pacman -S --noconfirm alsa-ucm-conf-xiaomi-nabu
          EOF

      - name: Install qualcomm wlan services
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          pacman -S --noconfirm tqftpserv rmtfs
          systemctl enable tqftpserv rmtfs
          EOF

      - name: Install and configure sudo
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          pacman -S --noconfirm sudo
          echo "%wheel ALL=(ALL:ALL) NOPASSWD: ALL" > /etc/sudoers.d/10-nopasswd
          EOF

      - name: Install console font
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          pacman -S --noconfirm terminus-font
          EOF

      - name: Localize shell
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          pacman -S --noconfirm fish
          chsh -s /usr/bin/fish alarm
          EOF

      - name: Apply base overlay
        run: |
          sudo cp ./repo/base/overlay/* -r ./mountpoint/
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          /overlay-post-apply
          rm /overlay-post-apply
          EOF

      - name: Enable nabu wlan service
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          systemctl enable nabu-pmac
          EOF

      - name: Create efi
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          cp /opt/nabu/efi-template/* -rv /boot/efi/
          mkdir /boot/efi/EFI/arch/
          rm /opt/nabu/efi-template -r
          EOF

      - name: Configure mkinitcpio(remove microcode)
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          sed -i "s|HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block filesystems fsck)|HOOKS=(base udev autodetect modconf kms keyboard keymap consolefont block filesystems fsck)|g" /etc/mkinitcpio.conf
          EOF

      - name: Install base packages
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          pacman -S --noconfirm networkmanager bluez bluez-utils vulkan-freedreno
          EOF

      - name: Enable bluetooth and network manager
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          systemctl enable bluetooth NetworkManager
          EOF

      - name: Generate UKI
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          mkinitcpio -P
          EOF

      - name: Pack efi
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          tar cvzf "/opt/nabu/efi.tgz" -C "/boot/efi/" .
          EOF

      - name: Localize keyboard
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          echo 'KEYMAP=colemak' >>/etc/vconsole.conf
          EOF

      - name: Localize timezone
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          EOF

      - name: Localize mirrorlist
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          echo 'Server = http://mirrors.ustc.edu.cn/archlinuxarm/$arch/$repo' > /etc/pacman.d/mirrorlist
          EOF

      - name: Update pacman cache
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          pacman -Syu --noconfirm
          EOF

      - name: Clear pacman cache
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          yes | pacman -Scc
          EOF

      - name: Export efi directory for artifact
        run: |
          mkdir -p ./efi
          sudo cp -a ./mountpoint/boot/efi/EFI/. ./efi/
          sudo chown -R $USER:$USER ./efi/

      - name: Unmount rootfs image
        run: |
          sudo umount -R ./mountpoint
          rmdir ./mountpoint

      - name: Prepare artifact directories
        run: |
          e2fsck -f rootfs.img -y
          resize2fs rootfs.img -M
          mkdir -p ./images
          mv ./rootfs.img ./images/
          mv ./repo/bin ./bin
          mv ./repo/DBKP ./DBKP
          mv ./repo/META-INF ./META-INF

      - name: Create ESP image
        run: |
          truncate -s 250M ./images/esp.img
          mkfs.fat -F 32 -S 4096 -n EFI ./images/esp.img
          mkdir -p ./esp-mount
          sudo mount -o loop ./images/esp.img ./esp-mount/
          sudo mkdir -p ./esp-mount/EFI
          sudo cp -r ./efi/* ./esp-mount/EFI/
          sudo umount ./esp-mount
          rmdir ./esp-mount

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: arch-nabu-installer
          path: |
            bin
            DBKP
            efi
            images
            META-INF
          retention-days: 90
          compression-level: 5
