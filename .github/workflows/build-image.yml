name: Build image
on: workflow_dispatch

jobs:
  build-image:
    name: Build image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: "extra-platforms = aarch64-linux"
      - name: Setup Cachix cache
        uses: cachix/cachix-action@v17
        with:
          name: nixpkgs-for-nabu
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Configure Fast APT Mirror
        uses: vegardit/fast-apt-mirror.sh@v1
        with:
          healthchecks: 20 # Number of mirrors from the mirrors list to check for availability and up-to-dateness
          speedtests: 10 # Maximum number of healthy mirrors to test for speed
          parallel: 10 # Number of parallel speed tests
          sample-size: 1024 # Number of kilobytes to download during the speed from each mirror
          sample-time: 3 # Maximum number of seconds within the sample download from a mirror must finish
          configure-mirror: auto
      - name: Prepare runner for QEMU/Nix builds
        run: |
          sudo apt update
          # Ensure qemu-system is available (qemu-user-static alone can be insufficient).
          # Install virtiofsd + FUSE3 so virtiofs can work
          sudo apt install -y qemu-user-static qemu-system qemu-system-arm qemu-system-aarch64 binfmt-support virtiofsd libfuse3-3
          # Create 24G swap (fallocate may not be available in some runners)
          if ! sudo swapon --show | grep -q '/swapfile'; then
            echo "Creating 24G swapfile at /swapfile"
            sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          else
            echo "Swapfile already active"
          fi
          # Diagnostics: show that swap is active and memory available
          echo "=== free -h ==="
          free -h || true
          echo "=== swapon --show ==="
          sudo swapon --show || true
          echo "=== vmstat 1 5 ==="
          vmstat 1 5 || true
      - name: Package the software
        run: |
          # Limit concurrency to avoid host OOM while qemu runs inside the build
          nix build --print-build-logs --max-jobs 1 --cores 1 .#image --system aarch64-linux
      - name: Build diagnostics (always)
        if: always()
        run: |
          echo "=== dmesg tail (last 200 lines) ==="
          sudo dmesg | tail -n 200 || true
          echo "=== journalctl -k -n 200 (kernel messages) ==="
          sudo journalctl -k -n 200 --no-pager || true
          echo "=== ps aux sorted by RSS (top processes) ==="
          ps aux --sort=-rss | head -n 40 || true
          echo "=== free -h ==="
          free -h || true
          echo "=== swapon --show ==="
          sudo swapon --show || true

          # --- 以下为新增：打印构建失败 drv 的 nix 日志（如果有） ---
          # 尝试在 /nix/store 中查找可能的 *-nixos-disk-image.drv 并打印其 nix 日志
          drv=$(find /nix/store -name '*-nixos-disk-image.drv' -print -quit || true)
          if [ -n "$drv" ]; then
            echo "=== nix log for $drv ==="
            nix log "$drv" || true
          else
            echo "No *-nixos-disk-image.drv file found in /nix/store"
          fi
      - name: Remove swap
        if: always()
        run: |
          if sudo swapon --show | grep -q '/swapfile'; then
            sudo swapoff /swapfile || true
            sudo rm -f /swapfile || true
          fi
